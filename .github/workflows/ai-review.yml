name: AI Code Review (Agentic)

# End-to-end agentic pipeline:
#   1. install deps
#   2. start backend + frontend in the background ("terminals" 1 & 2)
#   3. deterministic smoke: hit every endpoint
#   4. build git diff
#   5. run the tool-using Gemini AGENT against the running app + repo
#   6. post a PR / commit comment with the structured verdict
#   7. stop the services (both terminals disconnect)
#   8. gate: fail the check if smoke failed OR the agent said "block"
#   9. email collaborators on failure

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # needed for createCommitComment on push events
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://127.0.0.1:7860
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        continue-on-error: true

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai

      # ------------------------------------------------------------------
      # Start the two services in the background. PIDs are written to
      # disk so the "Stop services" step can clean them up on ANY exit.
      # ------------------------------------------------------------------
      - name: Start services (backend + frontend)
        id: start_services
        run: |
          set +e
          echo "::group::Terminal 1 — start backend (uvicorn :8000)"
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 \
                > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          echo "uvicorn PID=$(cat uvicorn.pid)"

          BACKEND_UP=0
          for i in $(seq 1 20); do
            if curl -fsS "$BACKEND_URL/health" > health.json 2>/dev/null; then
              BACKEND_UP=1; break
            fi
            sleep 1
          done
          if [ "$BACKEND_UP" -ne 1 ]; then
            echo "::error title=Backend failed to start::did not respond on $BACKEND_URL/health"
            echo "---uvicorn.log---"; cat uvicorn.log || true
            echo "SMOKE_STATUS=fail" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Terminal 2 — start frontend (Gradio :7860)"
          BACKEND_URL="$BACKEND_URL" \
            nohup python frontend/app.py > gradio.log 2>&1 &
          echo $! > gradio.pid
          echo "gradio PID=$(cat gradio.pid)"

          FRONTEND_UP=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$FRONTEND_URL/"; then
              FRONTEND_UP=1; break
            fi
            sleep 1
          done
          if [ "$FRONTEND_UP" -ne 1 ]; then
            echo "::error title=Frontend failed to start::did not respond on $FRONTEND_URL/"
            echo "---gradio.log---"; cat gradio.log || true
            echo "SMOKE_STATUS=fail" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "::endgroup::"

          echo "Both services are up and running."

      # ------------------------------------------------------------------
      # Deterministic endpoint smoke test.
      # ------------------------------------------------------------------
      - name: Smoke test — hit every endpoint
        id: smoke
        run: |
          set +e
          FAIL=0
          check_http() {
            local method="$1" url="$2" body="$3" expect="$4"
            local code
            if [ -n "$body" ]; then
              code=$(curl -sS -o resp.txt -w "%{http_code}" -X "$method" \
                        -H "Content-Type: application/json" --data "$body" "$url")
            else
              code=$(curl -sS -o resp.txt -w "%{http_code}" -X "$method" "$url")
            fi
            echo "--> $method $url  =>  HTTP $code"
            cat resp.txt; echo
            if [ "$code" != "200" ]; then
              echo "::error title=Endpoint failed::$method $url returned HTTP $code"
              FAIL=1; return
            fi
            if [ -n "$expect" ] && ! grep -q "$expect" resp.txt; then
              echo "::error title=Bad response body::$method $url did not contain '$expect'"
              FAIL=1
            fi
          }

          check_http GET  "$BACKEND_URL/"        ""                                              "Agentic AI Chatbot"
          check_http GET  "$BACKEND_URL/health"  ""                                              "healthy"
          check_http POST "$BACKEND_URL/chat"    '{"message":"hi","history":[]}'                  "\"reply\""
          check_http POST "$BACKEND_URL/chat"    '{"message":"what is your name?","history":[]}' "\"model\""
          check_http GET  "$FRONTEND_URL/"       ""                                              ""

          if [ "$FAIL" -eq 0 ]; then
            echo "SMOKE_STATUS=pass" >> "$GITHUB_ENV"
          else
            echo "SMOKE_STATUS=fail" >> "$GITHUB_ENV"
            exit 1
          fi

      # ------------------------------------------------------------------
      # Build the diff the agent will review.
      # ------------------------------------------------------------------
      - name: Build diff
        id: diff
        if: always()
        continue-on-error: true
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git diff --unified=3 $(git hash-object -t tree /dev/null) "$HEAD" > diff.patch 2>diff_error.log
          else
            git diff --unified=3 "$BASE" "$HEAD" > diff.patch 2>diff_error.log
          fi
          head -c 60000 diff.patch > diff.trimmed 2>/dev/null || true
          mv diff.trimmed diff.patch 2>/dev/null || true
          echo "Diff bytes: $(wc -c < diff.patch 2>/dev/null || echo 0)"

      # ------------------------------------------------------------------
      # AGENTIC REVIEW — tool-using LLM against the running app + repo.
      # Runs even if smoke failed so the agent can explain what broke.
      # ------------------------------------------------------------------
      - name: Agentic review with Gemini
        id: agent
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: python .github/scripts/ai_reviewer.py

      # ------------------------------------------------------------------
      # Post the review as a PR / commit comment.
      # ------------------------------------------------------------------
      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        env:
          CHECKOUT:      ${{ steps.checkout.outcome }}
          SETUP_PY:      ${{ steps.setup_python.outcome }}
          INSTALL:       ${{ steps.install.outcome }}
          START:         ${{ steps.start_services.outcome }}
          SMOKE_STATUS:  ${{ env.SMOKE_STATUS }}
          DIFF:          ${{ steps.diff.outcome }}
          AGENT:         ${{ steps.agent.outcome }}
        with:
          script: |
            const fs = require('fs');
            const mark = (s) => s === 'success' ? '✅' : (s === 'skipped' ? '⏭️' : '❌');
            const review = fs.existsSync('review.md')
              ? fs.readFileSync('review.md', 'utf8')
              : '_(no review produced — see the workflow logs)_';
            const blocking = fs.existsSync('review_blocking.txt')
              && fs.readFileSync('review_blocking.txt', 'utf8').trim() === '1';
            const smokeFailed = process.env.SMOKE_STATUS === 'fail';
            const verdict = (blocking || smokeFailed)
              ? '❌ **This change is blocked** — fix the issues below and push again.'
              : '✅ **No blocking issues found.**';

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const smoke = process.env.SMOKE_STATUS === 'pass' ? '✅ pass' :
                          (process.env.SMOKE_STATUS === 'fail' ? '❌ fail' : '⏭️ skipped');

            const body = [
              `## 🤖 Agentic AI Code Review`,
              ``,
              verdict,
              ``,
              `| Step | Status |`,
              `|---|---|`,
              `| Checkout | ${mark(process.env.CHECKOUT)} |`,
              `| Set up Python | ${mark(process.env.SETUP_PY)} |`,
              `| \`pip install\` | ${mark(process.env.INSTALL)} |`,
              `| Start backend + frontend | ${mark(process.env.START)} |`,
              `| Endpoint smoke tests | ${smoke} |`,
              `| Build diff | ${mark(process.env.DIFF)} |`,
              `| Agentic review (Gemini + tools) | ${mark(process.env.AGENT)} |`,
              ``,
              `---`,
              review,
              ``,
              `<sub>Reviewed by an autonomous Gemini agent using tools (<code>read_file</code>, <code>list_dir</code>, <code>grep</code>, <code>call_endpoint</code>) `,
              `and policy from <code>.github/copilot-instructions.md</code>. `,
              `Workflow run: <a href="${runUrl}">${context.runId}</a>.</sub>`,
            ].join('\n');

            try {
              if (context.eventName === 'pull_request') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body,
                });
              } else {
                await github.rest.repos.createCommitComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                  body,
                });
              }
              core.info('Comment posted.');
            } catch (e) {
              core.setFailed(
                `Could not post comment: ${e.message}\n\n` +
                `Fix: Settings → Actions → General → Workflow permissions → "Read and write permissions", then re-run.`
              );
            }

      # ------------------------------------------------------------------
      # Stop background services (both "terminals" disconnect).
      # Always runs — success or failure.
      # ------------------------------------------------------------------
      - name: Stop services
        if: always()
        run: |
          echo "::group::Stop backend & frontend"
          for f in uvicorn.pid gradio.pid; do
            if [ -f "$f" ]; then
              PID=$(cat "$f")
              kill "$PID" 2>/dev/null || true
              sleep 1
              kill -9 "$PID" 2>/dev/null || true
              echo "Killed $f (PID $PID)."
            fi
          done
          echo "Both terminals disconnected."
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # Gate — fail the workflow (and the PR check) if either the smoke
      # failed or the agent verdict was "block".
      # ------------------------------------------------------------------
      - name: Gate — fail on blocking issues
        if: always()
        env:
          SMOKE_STATUS: ${{ env.SMOKE_STATUS }}
        run: |
          BLOCKING=0
          if [ -f review_blocking.txt ]; then
            BLOCKING=$(cat review_blocking.txt)
          fi
          if [ "$SMOKE_STATUS" = "fail" ]; then
            echo "::error::Smoke test failed — backend or frontend did not respond correctly."
            exit 1
          fi
          if [ "$BLOCKING" = "1" ]; then
            echo "::error::Agent verdict = block ([security] or [bug] findings). See the posted comment."
            exit 1
          fi
          echo "Agent verdict = allow. No blocking issues."

      # ------------------------------------------------------------------
      # Email collaborators on failure.
      # ------------------------------------------------------------------
      - name: Email collaborators on failure
        if: failure() && vars.NOTIFY_EMAILS != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ vars.NOTIFY_EMAILS }}
          subject: "[${{ github.repository }}] Agentic AI review failed on ${{ github.ref_name }}"
          body: |
            The "AI Code Review (Agentic)" workflow failed — the change is blocked.

            Repository: ${{ github.repository }}
            Branch:     ${{ github.ref_name }}
            Commit:     ${{ github.sha }}
            Actor:      ${{ github.actor }}
            Smoke:      ${{ env.SMOKE_STATUS }}

            Likely reasons:
              * Backend or frontend failed to boot / respond (smoke test).
              * The agent found [security] or [bug] issues in the diff.

            Full logs and posted review comment:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
