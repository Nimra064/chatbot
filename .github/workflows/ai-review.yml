name: AI Code Review

# Every step is resilient. The "post comment" step runs even if earlier
# steps failed, so you always see WHY on the commit / PR.

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # 'contents: write' is required for createCommitComment on push events.
  # 'pull-requests: write' + 'issues: write' cover PR comments.
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        continue-on-error: true

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # Smoke test — start FastAPI backend and hit /health
      # ------------------------------------------------------------------
      - name: Smoke test — boot backend & hit /health
        id: smoke
        # Do NOT continue-on-error: if the app cannot boot, the PR must fail.
        run: |
          set +e
          nohup uvicorn backend.main:app --port 8000 > uvicorn.log 2>&1 &
          UVICORN_PID=$!
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health > health.json 2>/dev/null; then
              echo "SMOKE_STATUS=pass" >> "$GITHUB_ENV"
              cat health.json
              kill $UVICORN_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "SMOKE_STATUS=fail" >> "$GITHUB_ENV"
          echo "---uvicorn.log---"
          cat uvicorn.log || true
          cp uvicorn.log smoke_error.log || true
          kill $UVICORN_PID 2>/dev/null || true
          # Fail the job so the PR check turns red.
          exit 1

      # ------------------------------------------------------------------
      # Build diff
      # ------------------------------------------------------------------
      - name: Build diff
        id: diff
        # Always run — even if smoke failed — so the comment shows what changed.
        if: always()
        continue-on-error: true
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git diff --unified=3 $(git hash-object -t tree /dev/null) "$HEAD" > diff.patch 2>diff_error.log
          else
            git diff --unified=3 "$BASE" "$HEAD" > diff.patch 2>diff_error.log
          fi

          head -c 60000 diff.patch > diff.trimmed 2>/dev/null || true
          mv diff.trimmed diff.patch 2>/dev/null || true
          echo "Diff bytes: $(wc -c < diff.patch 2>/dev/null || echo 0)"

      - name: Install Gemini SDK
        id: install_sdk
        if: always()
        continue-on-error: true
        run: pip install google-genai

      - name: AI review with Gemini
        id: ai
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: |
          python <<'PY' 2> ai_error.log || true
          import os, pathlib, textwrap, traceback

          try:
              api_key = os.environ.get("GEMINI_API_KEY")
              if not api_key:
                  pathlib.Path("review.md").write_text(
                      "> ⚠️ **AI review skipped** — `GEMINI_API_KEY` secret is not set.\n"
                      "> Add it at **Settings → Secrets and variables → Actions → New repository secret**."
                  )
                  raise SystemExit(0)

              from google import genai

              rules_path = pathlib.Path(".github/copilot-instructions.md")
              rules_text = rules_path.read_text(encoding="utf-8") if rules_path.exists() else "(no rules file)"
              diff_path = pathlib.Path("diff.patch")
              diff = diff_path.read_text(encoding="utf-8", errors="replace") if diff_path.exists() else ""
              if not diff.strip():
                  pathlib.Path("review.md").write_text("_No diff to review._")
                  raise SystemExit(0)

              prompt = textwrap.dedent(f"""
              You are a senior code reviewer for a FastAPI + Gradio + Gemini demo.
              Follow the review rules below EXACTLY. Only flag issues the rules
              tell you to flag. Be terse.

              ===== REVIEW RULES =====
              {rules_text}

              ===== DIFF =====
              {diff}

              ===== OUTPUT FORMAT =====
              Return Markdown with these sections (omit if empty):
              ### [security]
              - <issue> — file:line
              ### [bug]
              - <issue> — file:line
              ### [style]
              - <issue> — file:line
              ### Summary
              One or two sentences. If nothing to flag, say "LGTM".
              """).strip()

              client = genai.Client(api_key=api_key)
              resp = client.models.generate_content(
                  model=os.environ.get("GEMINI_MODEL", "gemini-flash-latest"),
                  contents=prompt,
              )
              review = (resp.text or "").strip() or "_(Gemini returned no content.)_"
              pathlib.Path("review.md").write_text(review, encoding="utf-8")
              print(review)

              # Decide whether the review contains blocking findings.
              # A section header like "### [security]" or "### [bug]" that is
              # followed by at least one bullet counts as blocking.
              import re
              blocking = False
              for tag in ("security", "bug"):
                  pattern = (
                      rf"^#+\s*\[{tag}\]\s*$"
                      r"(?P<body>.*?)"
                      r"(?=^#+\s|\Z)"
                  )
                  m = re.search(pattern, review, flags=re.MULTILINE | re.DOTALL | re.IGNORECASE)
                  if m and re.search(r"^\s*[-*]\s+\S", m.group("body"), flags=re.MULTILINE):
                      blocking = True
                      break
              pathlib.Path("review_blocking.txt").write_text("1" if blocking else "0")
              print(f"BLOCKING={blocking}")
          except SystemExit:
              raise
          except Exception as e:
              tb = traceback.format_exc()
              pathlib.Path("review.md").write_text(
                  f"> ❌ **AI review errored:**\n\n```\n{e}\n```\n\n<details><summary>Traceback</summary>\n\n```\n{tb}\n```\n</details>"
              )
              # An errored review should not silently pass.
              pathlib.Path("review_blocking.txt").write_text("1")
          PY

      # ------------------------------------------------------------------
      # Always post a comment — even on failure — so you see the reason
      # ------------------------------------------------------------------
      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_PY: ${{ steps.setup_python.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SMOKE_STATUS: ${{ env.SMOKE_STATUS }}
          DIFF: ${{ steps.diff.outcome }}
          SDK: ${{ steps.install_sdk.outcome }}
          AI: ${{ steps.ai.outcome }}
        with:
          script: |
            const fs = require('fs');
            const mark = (s) => s === 'success' ? '✅' : (s === 'skipped' ? '⏭️' : '❌');
            const review = fs.existsSync('review.md')
              ? fs.readFileSync('review.md', 'utf8')
              : '_(no review produced — see the workflow logs)_';
            const blocking = fs.existsSync('review_blocking.txt')
              && fs.readFileSync('review_blocking.txt', 'utf8').trim() === '1';
            const smokeFailed = process.env.SMOKE_STATUS === 'fail';
            const verdict = (blocking || smokeFailed)
              ? '❌ **This change is blocked** — fix the issues below and push again.'
              : '✅ **No blocking issues found.**';

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const smoke = process.env.SMOKE_STATUS === 'pass' ? '✅ pass' :
                          (process.env.SMOKE_STATUS === 'fail' ? '❌ fail' : '⏭️ skipped');

            const body = [
              `## 🤖 AI Code Review`,
              ``,
              verdict,
              ``,
              `| Step | Status |`,
              `|---|---|`,
              `| Checkout | ${mark(process.env.CHECKOUT)} |`,
              `| Set up Python | ${mark(process.env.SETUP_PY)} |`,
              `| \`pip install -r requirements.txt\` | ${mark(process.env.INSTALL)} |`,
              `| Backend boots + \`/health\` responds | ${smoke} |`,
              `| Build diff | ${mark(process.env.DIFF)} |`,
              `| Install Gemini SDK | ${mark(process.env.SDK)} |`,
              `| Run Gemini review | ${mark(process.env.AI)} |`,
              ``,
              `---`,
              review,
              ``,
              `<sub>Reviewed by Gemini using <code>.github/copilot-instructions.md</code>. `,
              `Workflow run: <a href="${runUrl}">${context.runId}</a>.</sub>`,
            ].join('\n');

            try {
              if (context.eventName === 'pull_request') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body,
                });
              } else {
                await github.rest.repos.createCommitComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                  body,
                });
              }
              core.info('Comment posted.');
            } catch (e) {
              core.setFailed(
                `Could not post comment: ${e.message}\n\n` +
                `Fix: Settings → Actions → General → Workflow permissions → "Read and write permissions", then re-run.`
              );
            }

      # ------------------------------------------------------------------
      # Final gate — fail the workflow (and therefore the PR check) if:
      #   * the smoke test failed, or
      #   * the AI review flagged [security] or [bug] issues.
      # This step runs AFTER "Post review comment" so users still see the
      # review before the red X appears.
      # ------------------------------------------------------------------
      - name: Gate — fail on blocking issues
        if: always()
        env:
          SMOKE_STATUS: ${{ env.SMOKE_STATUS }}
        run: |
          BLOCKING=0
          if [ -f review_blocking.txt ]; then
            BLOCKING=$(cat review_blocking.txt)
          fi
          if [ "$SMOKE_STATUS" = "fail" ]; then
            echo "::error::Smoke test failed — backend did not respond on /health."
            exit 1
          fi
          if [ "$BLOCKING" = "1" ]; then
            echo "::error::AI review reported blocking issues ([security] or [bug]). See the posted comment."
            exit 1
          fi
          echo "No blocking issues."
