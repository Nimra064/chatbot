name: AI Code Review

# Runs on every push AND on every pull request (opened / new commits).
# - Uses .github/copilot-instructions.md as the review guide.
# - Runs the code (install + boot backend + hit /health).
# - Reviews the diff with Gemini.
# - Posts a commit comment (push) or a PR comment (pull_request).

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        continue-on-error: true

      # ------------------------------------------------------------------
      # Run the code: start FastAPI backend and hit /health
      # ------------------------------------------------------------------
      - name: Smoke test — boot backend & hit /health
        id: smoke
        continue-on-error: true
        run: |
          set -e
          nohup uvicorn backend.main:app --port 8000 > uvicorn.log 2>&1 &
          UVICORN_PID=$!
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health > health.json 2>/dev/null; then
              echo "SMOKE_STATUS=pass" >> "$GITHUB_ENV"
              cat health.json
              kill $UVICORN_PID || true
              exit 0
            fi
            sleep 1
          done
          echo "SMOKE_STATUS=fail" >> "$GITHUB_ENV"
          echo "---uvicorn.log---"
          cat uvicorn.log || true
          kill $UVICORN_PID || true
          exit 1

      # ------------------------------------------------------------------
      # Build the diff (works for both push and pull_request events)
      # ------------------------------------------------------------------
      - name: Build diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git diff --unified=3 $(git hash-object -t tree /dev/null) "$HEAD" > diff.patch || true
          else
            git diff --unified=3 "$BASE" "$HEAD" > diff.patch || true
          fi

          head -c 60000 diff.patch > diff.trimmed
          mv diff.trimmed diff.patch
          echo "Diff bytes: $(wc -c < diff.patch)"

      - name: Install Gemini SDK
        run: pip install google-genai

      - name: AI review with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: |
          python <<'PY'
          import os, pathlib, textwrap
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              pathlib.Path("review.md").write_text(
                  "## AI review skipped\n\n"
                  "`GEMINI_API_KEY` secret is not set. "
                  "Add it at Settings → Secrets and variables → Actions."
              )
              raise SystemExit(0)

          rules = pathlib.Path(".github/copilot-instructions.md")
          rules_text = rules.read_text(encoding="utf-8") if rules.exists() else "(no rules file found)"
          diff = pathlib.Path("diff.patch").read_text(encoding="utf-8", errors="replace")
          if not diff.strip():
              pathlib.Path("review.md").write_text("## AI review\n\nNo diff to review.")
              raise SystemExit(0)

          prompt = textwrap.dedent(f"""
          You are a senior code reviewer for a FastAPI + Gradio + Gemini demo.
          Follow the review rules below EXACTLY. Only comment on issues the
          rules tell you to flag. Be terse.

          ===== REVIEW RULES =====
          {rules_text}

          ===== DIFF =====
          {diff}

          ===== OUTPUT FORMAT =====
          Return Markdown with these sections (omit a section if empty):

          ### [security]
          - <issue> — file:line

          ### [bug]
          - <issue> — file:line

          ### [style]
          - <issue> — file:line

          ### Summary
          One or two sentences on overall quality. If nothing to flag, say "LGTM".
          """).strip()

          client = genai.Client(api_key=api_key)
          resp = client.models.generate_content(
              model=os.environ.get("GEMINI_MODEL", "gemini-flash-latest"),
              contents=prompt,
          )
          review = (resp.text or "").strip() or "_(Gemini returned no content.)_"
          pathlib.Path("review.md").write_text(review, encoding="utf-8")
          print(review)
          PY

      # ------------------------------------------------------------------
      # Post the review: PR comment if this is a PR, commit comment otherwise
      # ------------------------------------------------------------------
      - name: Post review comment
        uses: actions/github-script@v7
        env:
          SMOKE_STATUS: ${{ env.SMOKE_STATUS }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        with:
          script: |
            const fs = require('fs');
            const review = fs.existsSync('review.md')
              ? fs.readFileSync('review.md', 'utf8')
              : '_(no review produced)_';

            const smoke = process.env.SMOKE_STATUS === 'pass' ? '✅ pass' : '❌ fail';
            const install = process.env.INSTALL_OUTCOME === 'success' ? '✅ pass' : '❌ fail';

            const body = [
              `## 🤖 AI Code Review`,
              ``,
              `| Check | Result |`,
              `|---|---|`,
              `| \`pip install -r requirements.txt\` | ${install} |`,
              `| Backend boots + \`/health\` responds | ${smoke} |`,
              ``,
              `---`,
              review,
              ``,
              `<sub>Reviewed by Gemini using \`.github/copilot-instructions.md\`.</sub>`,
            ].join('\n');

            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              });
            }
