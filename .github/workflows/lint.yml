name: Lint & Static Checks

# Layer 1 — deterministic checks that run BEFORE Copilot code review.
# Purpose: catch lint, formatting, type, and basic security issues cheaply,
# so Copilot doesn't waste its attention on things linters already flag.

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 mypy==1.11.2 bandit==1.7.9
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check backend frontend

      - name: Ruff format check
        run: ruff format --check backend frontend

      - name: Mypy type check
        run: mypy backend frontend --ignore-missing-imports

      - name: Bandit security scan
        run: bandit -r backend frontend -ll
